# Selene standard library: Luau + Roblox globals (declared as 'any').
# Used instead of std = "roblox", which needs to download the API dump.
# Real Roblox type checking is done by luau-lsp (scripts/check.sh).
base: luau
name: roblox_lite
globals:
  game:
    any: true
  workspace:
    any: true
  script:
    any: true
